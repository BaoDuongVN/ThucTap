<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Watch</title>
    <link rel="stylesheet" href="/Stop_watch/style.css">
</head>
<body>
    <div id="watch_container">
        <h1>Stopwatch</h1>
        <div id="watch_box">
            <div id="clock">00:00:00:00</div>
            <div id="btn-container">
                <button onclick="StartClick()" class="start">Start</button>
                <button onclick="StopClick()" class="stop">Stop</button>
                <button onclick="ResetClick()" class="reset">Reset</button>
            </div>
        </div>
        
    </div>
    <script src="/Stop_watch/index.js"></script>
</body>
</html>
